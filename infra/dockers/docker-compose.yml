# Stack base Finanças (Rails API + Vite SPA).
# VPS: docker compose -f docker-compose.yml -f docker-compose.vps.yml
# Imagens publicadas no GHCR pelo GitHub Actions (.github/workflows/build.yml).
# Build local (dev/emergência): adicionar -f docker-compose.build.yml

name: financas

services:
  api:
    image: ghcr.io/nicolasbispo/financas-repo-api:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: financas-app-api
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      RAILS_ENV: production
      PORT: "3000"
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${FINANCAS_DB_USER:-financas}
      POSTGRES_PASSWORD: ${FINANCAS_DB_PASSWORD}
      POSTGRES_DB: ${FINANCAS_DB_NAME:-financas_production}
      DEVISE_JWT_SECRET_KEY: ${DEVISE_JWT_SECRET_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://financas.nbdev.tech,http://financas.nbdev.tech}
      FORCE_SSL: "false"
      ACTIVE_STORAGE_SERVICE: local
    volumes:
      - api_storage:/src/app/storage

  frontend:
    image: ghcr.io/nicolasbispo/financas-repo-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: financas-app-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api

volumes:
  api_storage:
